<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Dependency and merge order graph for Agent A B C">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#121B34"/>
    </linearGradient>
    <marker id="arrowW" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#E5E7EB"/>
    </marker>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg3)"/>
  <text x="960" y="88" text-anchor="middle" fill="#F9FAFB" font-size="52" font-family="Inter, Segoe UI, Arial" font-weight="700">Agent A/B/C Dependency + Merge Order</text>
  <text x="960" y="136" text-anchor="middle" fill="#A5B4FC" font-size="28" font-family="Inter, Segoe UI, Arial">Merge in dependency order to keep main stable</text>

  <rect x="120" y="300" width="420" height="220" rx="20" fill="#1D4ED8" stroke="#93C5FD" stroke-width="3" filter="url(#shadow3)"/>
  <text x="330" y="378" text-anchor="middle" fill="#DBEAFE" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">Agent A</text>
  <text x="330" y="430" text-anchor="middle" fill="#BFDBFE" font-size="24" font-family="Inter, Segoe UI, Arial">Base contracts + shared types</text>
  <text x="330" y="468" text-anchor="middle" fill="#BFDBFE" font-size="24" font-family="Inter, Segoe UI, Arial">No dependency on B/C</text>

  <rect x="750" y="190" width="420" height="220" rx="20" fill="#047857" stroke="#6EE7B7" stroke-width="3" filter="url(#shadow3)"/>
  <text x="960" y="268" text-anchor="middle" fill="#D1FAE5" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">Agent B</text>
  <text x="960" y="320" text-anchor="middle" fill="#A7F3D0" font-size="24" font-family="Inter, Segoe UI, Arial">Feature implementation</text>
  <text x="960" y="358" text-anchor="middle" fill="#A7F3D0" font-size="24" font-family="Inter, Segoe UI, Arial">Depends on A contracts</text>

  <rect x="750" y="550" width="420" height="220" rx="20" fill="#9A3412" stroke="#FDBA74" stroke-width="3" filter="url(#shadow3)"/>
  <text x="960" y="628" text-anchor="middle" fill="#FFEDD5" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="800">Agent C</text>
  <text x="960" y="680" text-anchor="middle" fill="#FED7AA" font-size="24" font-family="Inter, Segoe UI, Arial">Tests + validation + docs</text>
  <text x="960" y="718" text-anchor="middle" fill="#FED7AA" font-size="24" font-family="Inter, Segoe UI, Arial">Depends on A and B</text>

  <line x1="540" y1="360" x2="750" y2="300" stroke="#E5E7EB" stroke-width="8" marker-end="url(#arrowW)"/>
  <line x1="540" y1="430" x2="750" y2="620" stroke="#E5E7EB" stroke-width="8" marker-end="url(#arrowW)"/>
  <line x1="960" y1="410" x2="960" y2="550" stroke="#E5E7EB" stroke-width="8" marker-end="url(#arrowW)"/>

  <rect x="1330" y="200" width="470" height="650" rx="20" fill="#111827" stroke="#6B7280" stroke-width="2"/>
  <text x="1565" y="270" text-anchor="middle" fill="#F3F4F6" font-size="38" font-family="Inter, Segoe UI, Arial" font-weight="800">Recommended Merge Order</text>

  <circle cx="1420" cy="350" r="34" fill="#1D4ED8"/>
  <text x="1420" y="361" text-anchor="middle" fill="#EFF6FF" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="800">1</text>
  <text x="1480" y="360" fill="#DBEAFE" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">Merge Agent A</text>
  <text x="1480" y="395" fill="#93C5FD" font-size="22" font-family="Inter, Segoe UI, Arial">stabilize contracts first</text>

  <circle cx="1420" cy="500" r="34" fill="#047857"/>
  <text x="1420" y="511" text-anchor="middle" fill="#ECFDF5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="800">2</text>
  <text x="1480" y="510" fill="#D1FAE5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">Merge Agent B</text>
  <text x="1480" y="545" fill="#6EE7B7" font-size="22" font-family="Inter, Segoe UI, Arial">rebase onto A before PR</text>

  <circle cx="1420" cy="650" r="34" fill="#9A3412"/>
  <text x="1420" y="661" text-anchor="middle" fill="#FFF7ED" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="800">3</text>
  <text x="1480" y="660" fill="#FFEDD5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">Merge Agent C</text>
  <text x="1480" y="695" fill="#FDBA74" font-size="22" font-family="Inter, Segoe UI, Arial">verify integrated behavior</text>

  <text x="1565" y="790" text-anchor="middle" fill="#9CA3AF" font-size="24" font-family="Inter, Segoe UI, Arial">Rule: upstream dependencies merge before downstream consumers</text>
</svg>
