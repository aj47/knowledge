<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Bad split versus good split of parallel tasks">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <text x="960" y="90" text-anchor="middle" fill="#F9FAFB" font-size="54" font-family="Inter, Segoe UI, Arial" font-weight="700">Bad Split vs Good Split</text>
  <text x="960" y="140" text-anchor="middle" fill="#9CA3AF" font-size="28" font-family="Inter, Segoe UI, Arial">Separate by ownership boundaries, not by random task slices</text>

  <rect x="80" y="180" width="840" height="820" rx="22" fill="#2A1217" stroke="#F87171" stroke-width="3" filter="url(#soft)"/>
  <text x="500" y="250" text-anchor="middle" fill="#FCA5A5" font-size="44" font-family="Inter, Segoe UI, Arial" font-weight="800">BAD SPLIT</text>
  <text x="500" y="292" text-anchor="middle" fill="#FECACA" font-size="24" font-family="Inter, Segoe UI, Arial">All agents touch same layers</text>

  <rect x="150" y="340" width="700" height="130" rx="12" fill="#3F1D1D" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="390" text-anchor="middle" fill="#FEE2E2" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent A: Login UI + API + Tests</text>
  <text x="500" y="428" text-anchor="middle" fill="#FCA5A5" font-size="22" font-family="Inter, Segoe UI, Arial">edits src/ui/login.tsx + src/api/client.ts + test/auth.spec.ts</text>

  <rect x="150" y="500" width="700" height="130" rx="12" fill="#3F1D1D" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="550" text-anchor="middle" fill="#FEE2E2" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent B: Signup UI + API + Tests</text>
  <text x="500" y="588" text-anchor="middle" fill="#FCA5A5" font-size="22" font-family="Inter, Segoe UI, Arial">edits src/ui/signup.tsx + src/api/client.ts + test/auth.spec.ts</text>

  <rect x="150" y="660" width="700" height="130" rx="12" fill="#3F1D1D" stroke="#EF4444" stroke-width="2"/>
  <text x="500" y="710" text-anchor="middle" fill="#FEE2E2" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent C: Password reset + API + Tests</text>
  <text x="500" y="748" text-anchor="middle" fill="#FCA5A5" font-size="22" font-family="Inter, Segoe UI, Arial">edits src/ui/reset.tsx + src/api/client.ts + test/auth.spec.ts</text>

  <text x="500" y="885" text-anchor="middle" fill="#EF4444" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">Result: guaranteed merge conflicts</text>

  <rect x="1000" y="180" width="840" height="820" rx="22" fill="#0B2A21" stroke="#34D399" stroke-width="3" filter="url(#soft)"/>
  <text x="1420" y="250" text-anchor="middle" fill="#86EFAC" font-size="44" font-family="Inter, Segoe UI, Arial" font-weight="800">GOOD SPLIT</text>
  <text x="1420" y="292" text-anchor="middle" fill="#BBF7D0" font-size="24" font-family="Inter, Segoe UI, Arial">Each agent owns isolated boundaries</text>

  <rect x="1070" y="340" width="700" height="130" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1420" y="390" text-anchor="middle" fill="#D1FAE5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent A: UI components only</text>
  <text x="1420" y="428" text-anchor="middle" fill="#86EFAC" font-size="22" font-family="Inter, Segoe UI, Arial">src/ui/* (no API client edits)</text>

  <rect x="1070" y="500" width="700" height="130" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1420" y="550" text-anchor="middle" fill="#D1FAE5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent B: API contract only</text>
  <text x="1420" y="588" text-anchor="middle" fill="#86EFAC" font-size="22" font-family="Inter, Segoe UI, Arial">src/api/* + typed interfaces</text>

  <rect x="1070" y="660" width="700" height="130" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <text x="1420" y="710" text-anchor="middle" fill="#D1FAE5" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">Agent C: tests + docs only</text>
  <text x="1420" y="748" text-anchor="middle" fill="#86EFAC" font-size="22" font-family="Inter, Segoe UI, Arial">test/* + docs/* (consumes A/B outputs)</text>

  <text x="1420" y="885" text-anchor="middle" fill="#22C55E" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">Result: low-conflict integration path</text>
</svg>
