<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; fill: #0f172a; }
      .label { font: 600 22px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; fill: #0f172a; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#f8fafc"/>
  <text x="700" y="70" class="title" text-anchor="middle">One Git Database, Three Working Folders</text>

  <rect x="520" y="140" width="360" height="140" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="700" y="195" class="label" text-anchor="middle">demo-worktree-repo/.git</text>
  <text x="700" y="230" class="small" text-anchor="middle">objects • refs • history</text>

  <rect x="80" y="470" width="360" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="260" y="530" class="label" text-anchor="middle">demo-worktree-repo</text>
  <text x="260" y="565" class="small" text-anchor="middle">branch: main</text>
  <text x="260" y="595" class="small" text-anchor="middle">shared git metadata</text>

  <rect x="520" y="470" width="360" height="170" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="700" y="530" class="label" text-anchor="middle">wt-feature-auth</text>
  <text x="700" y="565" class="small" text-anchor="middle">branch: feature/auth</text>
  <text x="700" y="595" class="small" text-anchor="middle">linked worktree</text>

  <rect x="960" y="470" width="360" height="170" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1140" y="530" class="label" text-anchor="middle">wt-feature-billing</text>
  <text x="1140" y="565" class="small" text-anchor="middle">branch: feature/billing</text>
  <text x="1140" y="595" class="small" text-anchor="middle">linked worktree</text>

  <line x1="700" y1="280" x2="260" y2="460" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="280" x2="700" y2="460" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="280" x2="1140" y2="460" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="700" y="730" class="small" text-anchor="middle">Worktrees share one Git object database while keeping separate checked-out folders.</text>
</svg>
