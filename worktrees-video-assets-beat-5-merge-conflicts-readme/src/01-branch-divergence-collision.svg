<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Parallel branches diverging then colliding at merge point">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111936"/>
    </linearGradient>
    <marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#34D399"/>
    </marker>
    <marker id="arrowC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#F59E0B"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <text x="960" y="90" text-anchor="middle" fill="#E5E7EB" font-size="52" font-family="Inter, Segoe UI, Arial" font-weight="700">Parallel Branch Divergence → Merge Collision</text>
  <text x="960" y="140" text-anchor="middle" fill="#93C5FD" font-size="28" font-family="Inter, Segoe UI, Arial">Why independent work can still collide without boundary planning</text>

  <rect x="110" y="450" rx="18" ry="18" width="230" height="130" fill="#1F2937" stroke="#9CA3AF" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="505" text-anchor="middle" fill="#F3F4F6" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="600">main</text>
  <text x="225" y="545" text-anchor="middle" fill="#9CA3AF" font-size="22" font-family="Inter, Segoe UI, Arial">start point</text>

  <path d="M340 515 C520 515, 560 280, 760 280" fill="none" stroke="#60A5FA" stroke-width="12" marker-end="url(#arrowA)"/>
  <path d="M340 515 C520 515, 560 515, 760 515" fill="none" stroke="#34D399" stroke-width="12" marker-end="url(#arrowB)"/>
  <path d="M340 515 C520 515, 560 760, 760 760" fill="none" stroke="#F59E0B" stroke-width="12" marker-end="url(#arrowC)"/>

  <rect x="770" y="210" rx="14" ry="14" width="320" height="140" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/>
  <text x="930" y="262" text-anchor="middle" fill="#BFDBFE" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">branch/auth</text>
  <text x="930" y="306" text-anchor="middle" fill="#93C5FD" font-size="22" font-family="Inter, Segoe UI, Arial">touches api/client.ts</text>

  <rect x="770" y="445" rx="14" ry="14" width="320" height="140" fill="#052E2B" stroke="#34D399" stroke-width="3"/>
  <text x="930" y="497" text-anchor="middle" fill="#A7F3D0" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">branch/ui</text>
  <text x="930" y="541" text-anchor="middle" fill="#6EE7B7" font-size="22" font-family="Inter, Segoe UI, Arial">touches api/client.ts</text>

  <rect x="770" y="690" rx="14" ry="14" width="320" height="140" fill="#3A2605" stroke="#F59E0B" stroke-width="3"/>
  <text x="930" y="742" text-anchor="middle" fill="#FCD34D" font-size="30" font-family="Inter, Segoe UI, Arial" font-weight="700">branch/tests</text>
  <text x="930" y="786" text-anchor="middle" fill="#FBBF24" font-size="22" font-family="Inter, Segoe UI, Arial">touches api/client.ts</text>

  <line x1="1090" y1="280" x2="1320" y2="515" stroke="#60A5FA" stroke-width="8" marker-end="url(#arrowA)"/>
  <line x1="1090" y1="515" x2="1320" y2="515" stroke="#34D399" stroke-width="8" marker-end="url(#arrowB)"/>
  <line x1="1090" y1="760" x2="1320" y2="515" stroke="#F59E0B" stroke-width="8" marker-end="url(#arrowC)"/>

  <polygon points="1320,440 1640,440 1730,515 1640,590 1320,590 1410,515" fill="#3F1D1D" stroke="#F87171" stroke-width="4" filter="url(#shadow)"/>
  <text x="1530" y="505" text-anchor="middle" fill="#FCA5A5" font-size="34" font-family="Inter, Segoe UI, Arial" font-weight="700">MERGE COLLISION</text>
  <text x="1530" y="547" text-anchor="middle" fill="#FECACA" font-size="24" font-family="Inter, Segoe UI, Arial">Same hotspots edited in parallel</text>

  <rect x="1280" y="700" rx="14" ry="14" width="500" height="170" fill="#111827" stroke="#6B7280" stroke-width="2"/>
  <text x="1310" y="748" fill="#F3F4F6" font-size="28" font-family="Inter, Segoe UI, Arial" font-weight="700">Collision signals</text>
  <text x="1310" y="790" fill="#D1D5DB" font-size="24" font-family="Inter, Segoe UI, Arial">• overlapping file ownership</text>
  <text x="1310" y="826" fill="#D1D5DB" font-size="24" font-family="Inter, Segoe UI, Arial">• long-lived branches</text>
</svg>
